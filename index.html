
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Baca</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="#">Ruang Baca</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#">Beranda</a>
                <a class="nav-link" href="#">Tentang</a>
                <a class="nav-link" href="#">Bantuan</a>
            </div>
        </div>
    </nav>

    <!-- AREA LOGIN -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">Masuk ke Ruang Baca</h2>
                        <div class="text-center mb-4">Temukan bacaan untuk hari ini.</div>

                        <!-- INPUT USERNAME -->
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>
                            <input type="text" class="form-control"
                                   id="username"
                                   placeholder="Masukkan username">
                        </div>

                        <!-- INPUT PASSWORD -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="password" class="form-control"
                                   id="password"
                                   placeholder="Masukkan password">
                        </div>

                        <!-- CHECKBOX -->
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox"
                                   id="ingatSaya">
                            <label class="form-check-label" for="ingatSaya">
                                Ingat saya
                            </label>
                        </div>

                        <!-- TOMBOL MASUK -->
                        <button type="button"
                                class="btn btn-success w-100 mb-3">
                            Masuk
                        </button>

                        <!-- LUPA PASSWORD -->
                        <div class="text-center">
                            <a href="#" class="text-decoration-none">
                                Lupa password?
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
